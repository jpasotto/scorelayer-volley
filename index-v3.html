<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>ScoreLayer Volley — moved</title>
<link rel="canonical" href="./index.html" />
<script>
  // v3.0 cutover (issue #30): index-v3.html became index.html.
  // Preserve any query string (notably ?m={matchId} for spectator URLs)
  // by computing the target client-side instead of using a static
  // <meta http-equiv="refresh">.
  (function () {
    var target = "./index.html" + (location.search || "") + (location.hash || "");
    location.replace(target);
  })();
</script>
<noscript>
  <meta http-equiv="refresh" content="0; url=./index.html" />
</noscript>
</head>
<body>
<p>Redirecting to <a href="./index.html">ScoreLayer Volley</a>&hellip;</p>
</body>
</html>

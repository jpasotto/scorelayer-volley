name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
    # Skip deploys for changes that don't affect the served app.
    # README.md is NOT excluded: the app fetches it at runtime as the in-app manual.
    # Order matters: later patterns override earlier ones.
    paths:
      - "**"
      - "!prompts/**"
      - "!tests/**"
      - "!.github/**"
      - "!**/*.md"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

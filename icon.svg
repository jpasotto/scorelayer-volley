<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>ScoreLayer Volley — Candidate A1 (volleyball with SL overlaid, seams behind)</title>
  <rect width="512" height="512" rx="96" ry="96" fill="#0a0e14"/>
  <!-- Orange volleyball disc -->
  <circle cx="256" cy="256" r="180" fill="#ff6b2b"/>
  <!-- Seam curves (behind the letters) -->
  <g fill="none" stroke="#fff4ec" stroke-width="14" stroke-linecap="round" opacity="0.7">
    <path d="M 120 215 Q 256 120 392 215"/>
    <path d="M 130 295 Q 210 415 320 405"/>
    <path d="M 365 168 Q 410 290 320 405"/>
  </g>
  <!-- SL letters layered on top, dark to read against orange -->
  <text x="256" y="280"
        font-family="DejaVu Sans, Liberation Sans, Arial Black, sans-serif"
        font-weight="900"
        font-size="280"
        fill="#0a0e14"
        text-anchor="middle"
        dominant-baseline="central"
        letter-spacing="-10">SL</text>
</svg>
